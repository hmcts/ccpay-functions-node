# Overrides for the ephemeral functional-test release deployed against AAT's real Service Bus.
# Used by Jenkinsfile_CNP / Jenkinsfile_nightly (helm upgrade --install -f values.ft.yaml).
#
# NOTE: default values.yaml (and THIS file) are merged by Helm, so this file only needs to
# override the pieces that differ for the FT release. function.triggers is fully re-declared here
# (do NOT override it via --set index merge, e.g. triggers[0].topicName - that wipes the sibling
# fields and the servicebus trigger stops rendering).
#
# Dynamic per-branch values (release-specific image tags + SERVICE_CALLBACK_URL_PATTERN referencing
# the per-branch rig service) are still passed via --set in the Jenkinsfile.

function:
  image: 'hmctsprod.azurecr.io/ccpay/callback-function:latest'
  scaleType: Job
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 5
  triggers:
    - type: azure-servicebus
      topicName: "ccpay-service-callback-ft-topic"
      subscriptionName: serviceCallbackFunctionalTestSubscription
      connectionFromEnv: SERVICE_CALLBACK_BUS_CONNECTION
      messageCount: 5
  environment:
    MICROSERVICE_PAYMENT_APP: "payment_app"
    SERVICE_LOGGING_ENABLED: false
    SERVICE_CALLBACK_TOPIC_NAME: "ccpay-service-callback-ft-topic"
    SERVICE_CALLBACK_SUBSCRIPTION: "serviceCallbackFunctionalTestSubscription"

rig:
  enabled: true

functional-test:
  enabled: true